[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pces-icu"
version = "0.1.0"
description = "Permutation-consistent ICU event-stream experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
]

[project.optional-dependencies]
llm = ["peft>=0.13", "bitsandbytes>=0.43"]
test = ["pytest>=8"]

[project.scripts]
pces-icu = "pces_icu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

